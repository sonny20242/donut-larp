name: build
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Arrange files
        run: |
          mkdir -p src/main/java/com/example/donutlarp/mixin
          mkdir -p src/main/resources/assets/donutlarp/lang
          mv DonutConfig.java DonutLarp.java LarpScreen.java NameSwap.java src/main/java/com/example/donutlarp/
          mv InGameHudMixin.java PlayerListHudMixin.java src/main/java/com/example/donutlarp/mixin/
          mv fabric.mod.json donutlarp.mixins.json src/main/resources/
          mv en_us.json src/main/resources/assets/donutlarp/lang/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - name: Build
        shell: bash
        run: gradle build --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Save log into the repo
        if: always()
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          mkdir -p logs
          cp build.log logs/build.log
          git add -f logs/build.log
          git commit -m "build log" || true
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: donutlarp-jar
          path: build/libs/*.jar
